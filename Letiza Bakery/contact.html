<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Find Letiza Bakery's location, opening hours, and contact details.">
    <title>Letiza Bakery | Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Letiza Bakery</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Contact Us</h2>

        <section class="contact-details">
            <p><strong>Address:</strong> 131 Section D, Mzombane, Mokopane, Limpopo</p>
            <p><strong>Phone:</strong> 072 634 3567</p>
            <p><strong>Email:</strong> letiza.bakery@gmail.com</p>
            <p><strong>Opening Hours:</strong> Monday &ndash; Saturday, 7:00 AM &ndash; 5:00 PM (Closed Sunday)</p>
        </section>

        <!-- Embedded Google Map - to be replaced with real embed code in Part 3 -->
        <section class="map">
            <h3>Find Us</h3>
            <iframe
                title="Letiza Bakery location map"
                src="https://www.google.com/maps?q=Mokopane,+Limpopo&output=embed"
            </iframe>
        </section>

        <section class="contact-form">
            <h3>Send Us a Message</h3>
            <form action="#" method="post">
                <label for="c-name">Full Name</label>
                <input type="text" id="c-name" name="c-name" required>

                <label for="c-email">Email Address</label>
                <input type="email" id="c-email" name="c-email" required>

                <label for="c-message">Message</label>
                <textarea id="c-message" name="c-message" rows="5" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Letiza Bakery, Mokopane. All rights reserved.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
